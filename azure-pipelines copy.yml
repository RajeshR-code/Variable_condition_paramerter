pool: rrpool

trigger:
- main
- feature/*

parameters:
- name: env
  displayName: select environment
  type: string
  default: dev
  values:
    - dev
    - qa
    - preprod
    - prod

variables:
  WORK_DIR: '$(System.DefaultWorkingDirectory)/env/${{ parameters.env }}'

stages:
  - stage: Security_Scan
    jobs:
      - job: Security_Scan
        displayName: Security_Scan
        steps:
        - task: Bash@3
          inputs:
            targetType: 'inline'
            script: tfsec $(WORK_DIR)

  - stage: init_plan
    displayName: 
    jobs:
      - job: init_plan
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: $(WORK_DIR)
            backendServiceArm: 'rrsp'
            backendAzureRmResourceGroupName: 'Backendrg'
            backendAzureRmStorageAccountName: 'backendfiles1'
            backendAzureRmContainerName: 'piplinecontainer'
            backendAzureRmKey: 'dev.terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: $(WORK_DIR)
            environmentServiceNameAzureRM: 'rrsp'

  - stage: approval
    displayName: approval
    pool: server
    jobs:
      - job: approval
        displayName: approval
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'rrdba@b18g46.onilne'
            instructions: 'Pls check and approve'

  - stage: apply
    displayName: apply 
    dependsOn: approval
    jobs:
      - job: apply
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: $(WORK_DIR)
            backendServiceArm: 'rrsp'
            backendAzureRmResourceGroupName: 'Backendrg'
            backendAzureRmStorageAccountName: 'backendfiles1'
            backendAzureRmContainerName: 'piplinecontainer'
            backendAzureRmKey: 'dev.terraform.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: $(WORK_DIR)
            environmentServiceNameAzureRM: 'rrsp'